replicaCount: 2
image:
  repository: ghcr.io/example/sentinel-core
  tag: ""
  pullPolicy: IfNotPresent
service:
  type: ClusterIP
  publicPort: 8443
  privatePort: 9443
database:
  url: ""
redis:
  url: "redis://sentinel-core-redis:6379/0"
secrets:
  jwtSecret: ""
  enterpriseAuthToken: ""
  caCertPEM: ""
  caKeyPEM: ""
  jwtPrivateKeyPEM: ""
  jwtPublicKeyPEM: ""
  jwtKeyID: ""
  jwtRevocationVersion: "1"
  jwtIssuer: ""
  jwtAudience: ""
securityContext:
  runAsNonRoot: true
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]
podSecurityContext:
  seccompProfile:
    type: RuntimeDefault
resources: {}
serviceMonitor:
  enabled: false

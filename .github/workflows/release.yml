name: Release Sentinel Core

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build Production Binary
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-w -s" -o sentinel-core cmd/server/main.go

      - name: Create GitHub Release & Upload Binary
        uses: softprops/action-gh-release@v1
        with:
          files: sentinel-core
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

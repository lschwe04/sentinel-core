name: Sentinel Hub CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Go einrichten
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Abhängigkeiten laden
        run: go mod download

      - name: Unit-Tests ausführen
        run: go test -v -race ./...

      - name: Kompilierungstest (Hub bauen)
        run: go build -v -o sentinel-hub ./cmd/hub/main.go
